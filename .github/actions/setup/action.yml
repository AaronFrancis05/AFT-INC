name: Setup
description: Node from .nvmrc, the pinned npm, a clean install, and the install script review check.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install pinned npm
      shell: bash
      run: |
        npm install -g npm@11.19.1
        test "$(npm -v)" = "11.19.1" || { echo "Expected npm 11.19.1, got $(npm -v)"; exit 1; }

    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund

    - name: Check install scripts are reviewed
      shell: bash
      run: |
        out="$(npm install-scripts ls)"
        echo "$out"
        echo "$out" | grep -q "No packages with unreviewed install scripts" || { echo "Unreviewed install scripts found. Approve or deny them with npm install-scripts."; exit 1; }
