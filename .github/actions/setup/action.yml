name: Setup
description: pnpm from packageManager, Node from .nvmrc, a frozen install (fails on an unreviewed build script), and the Turborepo cache.

runs:
  using: composite
  steps:
    # No version input: the action reads the pinned packageManager from package.json.
    - uses: pnpm/action-setup@v5

    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # strictDepBuilds is on, so a build script missing from allowBuilds fails here (spec 0008, AC-8).
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Restore Turborepo cache
      uses: actions/cache@v4
      with:
        path: .turbo
        # github.job is the calling job, so each job saves and restores its own task results.
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
