name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Placeholders only; nothing here is a secret (I6). One value per variable across all
# jobs keeps Turborepo hashes stable (spec 0008, CI placeholders). TURBO_FORCE lives in the
# test job on purpose: Turborepo's own variables never enter task hashes, so it does not
# break that rule (AC-20).
env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aft_ci
  BETTER_AUTH_SECRET: ci-only-not-a-secret-0123456789abcdef
  BETTER_AUTH_URL: http://localhost:3000
  RESEND_API_KEY: re_ci_placeholder
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A rerun bypasses the Turborepo cache, so it really runs Vitest again.
      TURBO_FORCE: ${{ github.run_attempt > 1 }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run tests with coverage
        run: pnpm turbo run test:coverage //#test:root:coverage --concurrency=2
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: ignore

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: pnpm turbo run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm turbo run lint
      - name: Format
        run: pnpm turbo run format:check //#format:root:check

  prisma:
    name: prisma
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate schema
        run: pnpm --filter @aft/db exec prisma validate
      # The client is generated, not committed (spec 0008, AC-4), so generating it is the check.
      - name: Generate client
        run: pnpm turbo run db:generate

  build-smoke:
    name: build-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Empty database (no migrations, no rows) so any session lookup can connect.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aft_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**', 'packages/**', '!**/node_modules/**', '!**/.next/**', '!**/coverage/**', '!**/.turbo/**', '!**/generated/**', '!**/playwright-report/**', '!**/test-results/**') }}
          restore-keys: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @aft/app-web exec node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: pnpm --filter @aft/app-web exec playwright install --with-deps chromium
      # test:e2e depends on build, so Turborepo builds the app first.
      - name: Build and smoke test
        run: pnpm turbo run test:e2e --filter=@aft/app-web
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level high
