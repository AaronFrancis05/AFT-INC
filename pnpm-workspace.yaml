packages:
  - apps/*
  - packages/*

# Every dependency used by more than one workspace, pinned once at the version
# package-lock.json resolved before the move (spec 0008, AC-15, I25). @next/env is used
# only by apps/web but sits here so it stays equal to next (ci.test.ts checks it).
catalog:
  react: 19.2.4
  react-dom: 19.2.4
  next: 16.4.2
  "@next/env": 16.4.2
  better-auth: 1.7.11
  zod: 4.6.7
  sonner: 2.0.7
  "@phosphor-icons/react": 2.1.10
  lucide-react: 0.577.0
  "@prisma/client": 7.10.1
  "@prisma/adapter-pg": 7.10.1
  prisma: 7.10.1
  typescript: 5.9.3
  "@types/node": 24.19.2
  "@types/react": 19.2.14
  "@types/react-dom": 19.2.3
  eslint: 9.39.4
  eslint-config-next: 16.4.2
  vitest: 5.0.5
  "@vitest/coverage-v8": 5.0.5
  jsdom: 30.1.3
  "@vitejs/plugin-react": 5.2.0
  "@testing-library/react": 16.3.3
  "@testing-library/dom": 10.4.2
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/user-event": 14.6.8
  tailwindcss: 4.2.2
  "@tailwindcss/postcss": 4.2.2
  shadcn: 4.22.1
  server-only: 0.0.1
  react-hook-form: 7.71.2

# Dependency build scripts reviewed once, with the same decisions npm had in
# package.json allowScripts (spec 0008, AC-8). strictDepBuilds stays on, so a new
# unreviewed build script fails pnpm install locally and in CI (I21).
allowBuilds:
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false

auditConfig:
  # Only advisories with no available fix belong here, each as a GHSA ID
  # preceded by a comment with the reason and a review date (AC-9).
  ignoreGhsas: []
